function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

const LANGUAGE_CODES = {
  am: 'am',
  amh_Ethi: 'am',
  en: 'en',
  eng_Latn: 'en',
  ha: 'ha',
  hau_Latn: 'ha',
  ibo_Latn: 'ig',
  sw: 'sw',
  swh_Latn: 'sw',
  yo: 'yo',
  yor_Latn: 'yo',
  zu: 'zu',
  zul_Latn: 'zu',
};

function normalizeLang(code) { return LANGUAGE_CODES[code] || code || '?'; }
function getSrcLang(d) {
  const source = d.dataset_kwargs?.source_language;
  if (source) return normalizeLang(source);
  const sources = d.dataset_kwargs?.source_languages || [];
  return sources.length ? sources.map(normalizeLang).join(',') : '?';
}
function getTgtLang(d) { return normalizeLang(d.dataset_kwargs?.target_language); }
function directionLabel(d) { return getSrcLang(d) + '-' + getTgtLang(d); }

function shortModel(model) {
  if (!model) return '?';
  if (!model.startsWith('/')) return model.split('/').at(-1);
  const run = model.match(/\/runs\/([^/]+)/)?.[1] || model.split('/').filter(Boolean).at(-1);
  const step = model.match(/global_step_\d+/)?.[0];
  const family = (run.match(/^(.*?)_afridoc/)?.[1] || run).replaceAll('_', '-');
  const training = run.includes('_sft_') ? ' · SFT' : '';
  const reasoning = run.includes('reasoning') ? ' reasoning' : '';
  return family + training + reasoning + (step ? ' · ' + step : '');
}

function displayModel(d) { return d._display_model || shortModel(d.model); }

function formatMetric(name, value) {
  if (typeof value !== 'number') return value ?? '—';
  return name.startsWith('ssa_comet') ? value.toFixed(4) : value.toFixed(2);
}

function cometStatus(d, detailed=false) {
  const comet = d.ssa_comet || {status: 'not_evaluated'};
  if (comet.status === 'scored') {
    return '<span class="metric-status status-scored">Scored</span>';
  }
  if (comet.status === 'skipped_overlength') {
    const detail = detailed
      ? ' · ' + comet.num_overlength_segments + '/' + comet.num_samples + ' segments exceed context'
      : '';
    return '<span class="metric-status status-overlength">Context-limited</span>' + detail;
  }
  return '<span class="metric-status status-missing">Not evaluated</span>';
}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// Overview
function renderOverview() {
  const el = document.getElementById('tab-overview');
  const scored = DATA.filter(d => d.ssa_comet?.status === 'scored').length;
  const overlength = DATA.filter(d => d.ssa_comet?.status === 'skipped_overlength').length;
  const cats = {};
  DATA.forEach(d => {
    const c = d._category || 'uncategorized';
    if (!cats[c]) cats[c] = [];
    cats[c].push(d);
  });

  let h = '<div class="coverage-grid">';
  h += '<div class="coverage-card"><div class="value">' + DATA.length + '</div><div class="label">Translation runs</div></div>';
  h += '<div class="coverage-card"><div class="value">' + scored + '</div><div class="label">SSA-COMET scored</div></div>';
  h += '<div class="coverage-card"><div class="value">' + overlength + '</div><div class="label">Context-limited</div></div>';
  h += '</div>';
  for (const [cat, items] of Object.entries(cats).sort()) {
    h += '<div class="category-title">' + esc(cat) + '</div>';
    for (const d of items) {
      h += '<div class="section-title">' + esc(displayModel(d)) + ' · ' + esc(d.dataset) + ' · ' + esc(directionLabel(d)) + '</div>';
      h += '<div class="info-bar">';
      h += '<div><span class="lbl">Model:</span>' + esc(displayModel(d)) + '</div>';
      h += '<div><span class="lbl">Dataset:</span>' + esc(d.dataset) + '</div>';
      h += '<div><span class="lbl">Samples:</span>' + (d.num_samples ?? '—') + '</div>';
      h += '<div><span class="lbl">Direction:</span>' + esc(directionLabel(d)) + '</div>';
      h += '<div><span class="lbl">Time:</span>' + (d.elapsed_seconds ? d.elapsed_seconds + 's' : '—') + '</div>';
      h += '<div><span class="lbl">SSA-COMET:</span>' + cometStatus(d, true) + '</div>';
      h += '</div>';
      if (d.metrics) {
        h += '<div class="metrics-grid">';
        for (const [k,v] of Object.entries(d.metrics)) {
          h += '<div class="metric-card"><div class="label">' + esc(k) + '</div><div class="value">' + formatMetric(k, v) + '</div></div>';
        }
        h += '</div>';
      }
      if (d.ssa_comet?.status === 'scored') {
        const aggregation = d.ssa_comet.document_system_score == null
          ? 'segment mean'
          : 'equal-weight document mean';
        h += '<div class="metric-note">Reference-based SSA-COMET-MTL · ' + aggregation + ' · pinned revision ' + esc(d.ssa_comet.model_revision.slice(0, 12)) + '</div>';
      }
    }
  }
  el.innerHTML = h;
}

const DATASET_NAMES = {
  flores_plus: 'FLORES+',
  bouquet_sentence: 'BOUQuET · sentences',
  bouquet_paragraph: 'BOUQuET · paragraphs',
  mafand_mt: 'MAFAND-MT',
  afridocmt_health: 'AfriDocMT Health',
};
const LANGUAGE_NAMES = {am: 'Amharic', en: 'English', ha: 'Hausa', ig: 'Igbo',
  sw: 'Swahili', yo: 'Yoruba', zu: 'Zulu'};
function datasetLabel(dataset) { return DATASET_NAMES[dataset] || dataset; }
function languageLabel(direction) {
  return direction.split('-').map(code => LANGUAGE_NAMES[code] || code).join(' → ') + ' (' + direction + ')';
}

let comparisonDataset = null;
let comparisonDirection = null;

function comparisonOptions(rows, dataset, direction) {
  const datasets = [...new Set(rows.map(datasetKey))].sort(
    (a, b) => datasetLabel(a).localeCompare(datasetLabel(b))
  );
  if (!datasets.includes(dataset)) dataset = datasets.includes('flores_plus') ? 'flores_plus' : datasets[0] || null;
  const directions = [...new Set(rows.filter(row => datasetKey(row) === dataset).map(directionLabel))].sort();
  if (!directions.includes(direction)) direction = directions[0] || null;
  return {datasets, directions, dataset, direction};
}

function comparisonRows(rows, dataset, direction) {
  // Preserve separate sample-count cohorts and use the latest duplicate cell,
  // as in overall rankings. Never average different benchmarks or directions.
  const selected = rows.filter(row => datasetKey(row) === dataset && directionLabel(row) === direction);
  return Object.values(modelCellIndex(selected)).flatMap(model => Object.values(model.cells));
}

function comparisonTable(rows) {
  if (!rows.length) return '<p>No results are available for this selection.</p>';
  const cohorts = {};
  rows.forEach(row => {
    const key = row.num_samples ?? '?';
    if (!cohorts[key]) cohorts[key] = [];
    cohorts[key].push(row);
  });
  let h = '';
  for (const [samples, items] of Object.entries(cohorts)) {
    if (Object.keys(cohorts).length > 1) h += '<h3 class="section-title">' + esc(samples) + ' examples</h3>';
    const metrics = [...new Set(items.flatMap(row => Object.keys(row.metrics || {})))].sort();
    const best = {};
    for (const metric of metrics) {
      const completeCoverage = items.length > 1 && samples !== '?' && items.every(
        row => Number.isFinite(row.metrics?.[metric])
      );
      if (completeCoverage) {
        const values = items.map(row => row.metrics[metric]);
        best[metric] = metric === 'ter' ? Math.min(...values) : Math.max(...values);
      }
    }
    const sorted = [...items].sort((a, b) =>
      (b.metrics?.['chrf++'] ?? -Infinity) - (a.metrics?.['chrf++'] ?? -Infinity)
      || displayModel(a).localeCompare(displayModel(b))
    );
    h += '<div class="table-wrap"><table><thead><tr><th>Model</th><th>Samples</th><th>SSA status</th>';
    metrics.forEach(metric => h += '<th>' + esc(metric.toUpperCase()) + '</th>');
    h += '</tr></thead><tbody>';
    sorted.forEach(row => {
      h += '<tr><td class="model-cell">' + esc(displayModel(row)) + '</td><td>' + esc(row.num_samples ?? '—') + '</td><td>' + cometStatus(row) + '</td>';
      metrics.forEach(metric => {
        const value = row.metrics?.[metric];
        const cls = Number.isFinite(value) && best[metric] === value ? ' class="best"' : '';
        h += '<td' + cls + '>' + esc(formatMetric(metric, value)) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  return h;
}

// Dataset and language/direction controls show one exact comparison at a time.
function renderComparison() {
  const el = document.getElementById('tab-comparison');
  const options = comparisonOptions(DATA, comparisonDataset, comparisonDirection);
  comparisonDataset = options.dataset;
  comparisonDirection = options.direction;
  if (!options.datasets.length) {
    el.innerHTML = '<p>No comparison results are available yet.</p>';
    return;
  }
  let h = '<div class="comparison-controls"><label for="comparison-dataset">Dataset<select id="comparison-dataset">';
  options.datasets.forEach(dataset => {
    h += '<option value="' + esc(dataset) + '"' + (dataset === comparisonDataset ? ' selected' : '') + '>' + esc(datasetLabel(dataset)) + '</option>';
  });
  h += '</select></label><label for="comparison-direction">Language / translation direction<select id="comparison-direction">';
  options.directions.forEach(direction => {
    h += '<option value="' + esc(direction) + '"' + (direction === comparisonDirection ? ' selected' : '') + '>' + esc(languageLabel(direction)) + '</option>';
  });
  h += '</select></label></div><div class="metric-note">Choose a dataset and translation direction. Models are sorted by chrF++. Green marks the best available score within the same dataset, direction and sample count, only when every listed model has that metric. Ties are highlighted together. Higher is better except for TER; these are descriptive comparisons, not significance claims.</div>';
  h += '<div id="comparison-results" aria-live="polite"><h2 class="section-title">' + esc(datasetLabel(comparisonDataset)) + ' · ' + esc(languageLabel(comparisonDirection)) + '</h2>';
  h += comparisonTable(comparisonRows(DATA, comparisonDataset, comparisonDirection)) + '</div>';
  el.innerHTML = h;
  document.getElementById('comparison-dataset').addEventListener('change', event => {
    comparisonDataset = event.target.value;
    renderComparison();
    document.getElementById('comparison-dataset').focus();
  });
  document.getElementById('comparison-direction').addEventListener('change', event => {
    comparisonDirection = event.target.value;
    renderComparison();
    document.getElementById('comparison-direction').focus();
  });
}

function mean(values) {
  return values.length ? values.reduce((total, value) => total + value, 0) / values.length : null;
}

function rankingRows(data, metric, scope) {
  const models = modelCellIndex(data);
  return Object.values(models).map(model => {
    const matched = [...scope].map(key => model.cells[key]).filter(Boolean);
    const values = matched.map(row => row.metrics?.[metric]).filter(Number.isFinite);
    const complete = matched.length === scope.size && values.length === scope.size;
    return {label: model.label, matched: matched.length, scored: values.length,
      samples: matched.reduce((sum, row) => sum + row.num_samples, 0),
      value: complete && scope.size ? mean(values) : null};
  }).sort((a, b) => {
    if (a.value == null || b.value == null) return (a.value == null) - (b.value == null) || a.label.localeCompare(b.label);
    return (metric === 'ter' ? a.value - b.value : b.value - a.value) || a.label.localeCompare(b.label);
  });
}

function rankingTable(rows, metric, expected) {
  let h = '<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Model / checkpoint</th><th>' + esc(metric) + '</th><th>Cells present</th><th>Cells scored</th><th>Examples</th></tr></thead><tbody>';
  let rank = 0, previous = null;
  rows.forEach((row, i) => {
    if (row.value != null && row.value !== previous) rank = i + 1;
    h += '<tr><td>' + (row.value == null ? 'Not ranked' : rank) + '</td><td class="model-cell">' + esc(row.label) + '</td><td>' + formatMetric(metric, row.value) + '</td><td>' + row.matched + '/' + expected + '</td><td>' + row.scored + '/' + expected + '</td><td>' + row.samples.toLocaleString() + '</td></tr>';
    previous = row.value;
  });
  return h + '</tbody></table></div>';
}

let rankingMetric = 'chrf++';
function renderRankings() {
  const el = document.getElementById('tab-rankings');
  const canonical = DATA.filter(row => row._experiment_id === 'EXP-005');
  const scope = new Set((canonical.length ? canonical : DATA.filter(row => row._kind !== 'experiment')).map(exactCellKey));
  let h = '<div class="section-title">Overall model rankings</div><div class="metric-note">Equal-weight mean of dataset × direction cell scores on the frozen suite. Not a pooled corpus score or a blend of different metrics. All models/checkpoints are listed; incomplete metric or cell coverage is not ranked. Model-specific prompts differ; rankings are descriptive, not significance claims.</div>';
  h += '<label>Rank by <select id="ranking-metric">';
  ['chrf++', 'bleu', 'chrf', 'ter', 'ssa_comet_mtl'].forEach(metric => {
    h += '<option value="' + metric + '"' + (metric === rankingMetric ? ' selected' : '') + '>' + metric + (metric === 'ter' ? ' (lower is better)' : ' (higher is better)') + '</option>';
  });
  h += '</select></label>' + rankingTable(rankingRows(DATA, rankingMetric, scope), rankingMetric, scope.size);
  el.innerHTML = h;
  document.getElementById('ranking-metric').addEventListener('change', event => {
    rankingMetric = event.target.value; renderRankings();
  });
}

function datasetKey(d) {
  return d.dataset || (d._category || '').split('/').at(-1) || 'unknown';
}

function exactCellKey(d) {
  return datasetKey(d) + '|' + directionLabel(d) + '|' + (d.num_samples ?? '?');
}

function modelCellIndex(rows) {
  const models = {};
  rows.forEach(row => {
    if (!models[row.model]) models[row.model] = {label: displayModel(row), cells: {}};
    // A model can occur in more than one baseline experiment. Its latest dashboard
    // record replaces an identical dataset/direction/sample-count record.
    models[row.model].cells[exactCellKey(row)] = row;
  });
  return models;
}

renderOverview();
renderComparison();
renderRankings();
</script>

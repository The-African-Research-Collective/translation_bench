const LENGTHS = {};

function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

const LANGUAGE_CODES = {
  am: 'am',
  amh_Ethi: 'am',
  en: 'en',
  eng_Latn: 'en',
  ha: 'ha',
  hau_Latn: 'ha',
  ibo_Latn: 'ig',
  sw: 'sw',
  swh_Latn: 'sw',
  yo: 'yo',
  yor_Latn: 'yo',
  zu: 'zu',
  zul_Latn: 'zu',
};

function normalizeLang(code) { return LANGUAGE_CODES[code] || code || '?'; }
function getSrcLang(d) {
  const source = d.dataset_kwargs?.source_language;
  if (source) return normalizeLang(source);
  const sources = d.dataset_kwargs?.source_languages || [];
  return sources.length ? sources.map(normalizeLang).join(',') : '?';
}
function getTgtLang(d) { return normalizeLang(d.dataset_kwargs?.target_language); }
function directionLabel(d) { return getSrcLang(d) + '-' + getTgtLang(d); }

function shortModel(model) {
  if (!model) return '?';
  if (!model.startsWith('/')) return model.split('/').at(-1);
  const run = model.match(/\/runs\/([^/]+)/)?.[1] || model.split('/').filter(Boolean).at(-1);
  const step = model.match(/global_step_\d+/)?.[0];
  const family = (run.match(/^(.*?)_afridoc/)?.[1] || run).replaceAll('_', '-');
  const training = run.includes('_sft_') ? ' · SFT' : '';
  const reasoning = run.includes('reasoning') ? ' reasoning' : '';
  return family + training + reasoning + (step ? ' · ' + step : '');
}

function displayModel(d) { return d._display_model || shortModel(d.model); }

function formatMetric(name, value) {
  if (typeof value !== 'number') return value ?? '—';
  return name.startsWith('ssa_comet') ? value.toFixed(4) : value.toFixed(2);
}

function pairedModel(label) {
  return shortModel(PAIRED.models?.[label]?.name || label);
}

function signed(value) {
  if (typeof value !== 'number') return '—';
  return (value > 0 ? '+' : '') + value.toFixed(2);
}

function cometStatus(d, detailed=false) {
  const comet = d.ssa_comet || {status: 'not_evaluated'};
  if (comet.status === 'scored') {
    return '<span class="metric-status status-scored">Scored</span>';
  }
  if (comet.status === 'skipped_overlength') {
    const detail = detailed
      ? ' · ' + comet.num_overlength_segments + '/' + comet.num_samples + ' segments exceed context'
      : '';
    return '<span class="metric-status status-overlength">Context-limited</span>' + detail;
  }
  return '<span class="metric-status status-missing">Not evaluated</span>';
}

      h += '<div><span class="lbl">Dataset:</span>' + esc(d.dataset) + '</div>';
      h += '<div><span class="lbl">Samples:</span>' + (d.num_samples ?? '—') + '</div>';
      h += '<div><span class="lbl">Direction:</span>' + esc(directionLabel(d)) + '</div>';
      h += '<div><span class="lbl">Time:</span>' + (d.elapsed_seconds ? d.elapsed_seconds + 's' : '—') + '</div>';
      h += '<div><span class="lbl">SSA-COMET:</span>' + cometStatus(d, true) + '</div>';
      h += '</div>';
      if (d.metrics) {
        h += '<div class="metrics-grid">';
        for (const [k,v] of Object.entries(d.metrics)) {
          h += '<div class="metric-card"><div class="label">' + esc(k) + '</div><div class="value">' + formatMetric(k, v) + '</div></div>';
        }
        h += '</div>';
      }
      if (d.ssa_comet?.status === 'scored') {
        const aggregation = d.ssa_comet.document_system_score == null
          ? 'segment mean'
          : 'equal-weight document mean';
        h += '<div class="metric-note">Reference-based SSA-COMET-MTL · ' + aggregation + ' · pinned revision ' + esc(d.ssa_comet.model_revision.slice(0, 12)) + '</div>';
      }
    }
  }
  el.innerHTML = h;
}

let comparisonMode = 'direction';

function directionComparison() {
  const groups = {};
  DATA.forEach(d => {
    const dir = directionLabel(d);
    if (!groups[dir]) groups[dir] = [];
    groups[dir].push(d);
  });

  let h = '';
  for (const [dir, items] of Object.entries(groups).sort()) {
    // Collect all metrics in this group
    const allMetrics = new Set();
    items.forEach(d => Object.keys(d.metrics||{}).forEach(k => allMetrics.add(k)));
    const mList = [...allMetrics].sort();

    // Find best value per metric within this group
    const best = {};
    for (const m of mList) {
      const lower = m.toLowerCase().includes('ter');
      let bv = lower ? Infinity : -Infinity, bi = -1;
      items.forEach((d, i) => {
        const v = d.metrics?.[m];
        if (v == null) return;
        if (lower ? v < bv : v > bv) { bv = v; bi = i; }
      });
      best[m] = bi;
    }

    h += '<div class="category-title">' + esc(dir) + '</div>';
    h += '<div class="table-wrap"><table><thead><tr><th>Category</th><th>Model</th><th>Samples</th><th>SSA status</th>';
    mList.forEach(m => h += '<th>' + esc(m.toUpperCase()) + '</th>');
    h += '</tr></thead><tbody>';
    items.forEach((d, i) => {
      h += '<tr><td>' + esc(d._category || 'uncategorized') + '</td>';
      h += '<td class="model-cell">' + esc(displayModel(d)) + '</td>';
      h += '<td>' + (d.num_samples ?? '—') + '</td>';
      h += '<td>' + cometStatus(d) + '</td>';
      for (const m of mList) {
        const v = d.metrics?.[m];
        const cls = best[m] === i && items.length > 1 ? ' class="best"' : '';
        h += '<td' + cls + '>' + formatMetric(m, v) + '</td>';
      }
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  return h;
}

function categoryComparison() {
  const categories = {};
  DATA.forEach(d => {
    const category = d._category || 'uncategorized';
    if (!categories[category]) categories[category] = [];
    categories[category].push(d);
  });

  let h = '<div class="metric-note">Each dataset/category is split into its translation directions. Best highlighting compares models only within the same category and direction, and requires complete metric coverage.</div>';
  for (const [category, items] of Object.entries(categories).sort()) {
    h += '<div class="category-title">' + esc(category) + '</div>';
    const directions = {};
    items.forEach(d => {
      const direction = directionLabel(d);
      if (!directions[direction]) directions[direction] = [];
      directions[direction].push(d);
    });

    for (const [direction, directionItems] of Object.entries(directions).sort()) {
      const allMetrics = new Set();
      directionItems.forEach(d => Object.keys(d.metrics || {}).forEach(
        metric => allMetrics.add(metric)
      ));
      const mList = [...allMetrics].sort();
      const best = {};
      for (const metric of mList) {
        const completeCoverage = directionItems.length > 1 && directionItems.every(
          d => typeof d.metrics?.[metric] === 'number'
        );
        if (!completeCoverage) {
          best[metric] = null;
          continue;
        }
        const lower = metric.toLowerCase().includes('ter');
        best[metric] = directionItems.reduce((winner, d) => {
          if (winner == null) return d;
          return lower
            ? (d.metrics[metric] < winner.metrics[metric] ? d : winner)
            : (d.metrics[metric] > winner.metrics[metric] ? d : winner);
        }, null)?.model;
      }

      directionItems.sort(
        (a, b) => (b.metrics?.['chrf++'] ?? -Infinity) - (a.metrics?.['chrf++'] ?? -Infinity)
      );
      h += '<div class="section-title">' + esc(direction) + '</div>';
      h += '<div class="table-wrap"><table><thead><tr><th>Model</th><th>Samples</th><th>SSA status</th>';
      mList.forEach(metric => h += '<th>' + esc(metric.toUpperCase()) + '</th>');
      h += '</tr></thead><tbody>';
      directionItems.forEach(d => {
        h += '<tr><td class="model-cell">' + esc(displayModel(d)) + '</td>';
        h += '<td>' + (d.num_samples ?? '—') + '</td>';
        h += '<td>' + cometStatus(d) + '</td>';
        for (const metric of mList) {
          const cls = best[metric] === d.model ? ' class="best"' : '';
          h += '<td' + cls + '>' + formatMetric(metric, d.metrics?.[metric]) + '</td>';
        }
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }
  }
  return h;
}

// Comparison – selectable translation-direction or dataset/category view
function renderComparison() {
  const el = document.getElementById('tab-comparison');
  let h = '<div class="comparison-controls">';
  h += '<button class="comparison-mode-btn' + (comparisonMode === 'direction' ? ' active' : '') + '" data-comparison-mode="direction">By translation direction</button>';
  h += '<button class="comparison-mode-btn' + (comparisonMode === 'category' ? ' active' : '') + '" data-comparison-mode="category">By dataset / category</button>';
  h += '</div>';
  h += comparisonMode === 'category' ? categoryComparison() : directionComparison();
  el.innerHTML = h;
  el.querySelectorAll('[data-comparison-mode]').forEach(button => {
    button.addEventListener('click', () => {
      comparisonMode = button.dataset.comparisonMode;
      renderComparison();
    });
  });
}

function mean(values) {
  return values.length ? values.reduce((total, value) => total + value, 0) / values.length : null;
}

function rankingRows(data, metric, scope) {
  const models = modelCellIndex(data);
  return Object.values(models).map(model => {
    const matched = [...scope].map(key => model.cells[key]).filter(Boolean);
    const values = matched.map(row => row.metrics?.[metric]).filter(Number.isFinite);
    const complete = matched.length === scope.size && values.length === scope.size;
    return {label: model.label, matched: matched.length, scored: values.length,
      samples: matched.reduce((sum, row) => sum + row.num_samples, 0),
      value: complete && scope.size ? mean(values) : null};
  }).sort((a, b) => {
    if (a.value == null || b.value == null) return (a.value == null) - (b.value == null) || a.label.localeCompare(b.label);
    return (metric === 'ter' ? a.value - b.value : b.value - a.value) || a.label.localeCompare(b.label);
  });
}

function rankingTable(rows, metric, expected) {
  let h = '<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Model / checkpoint</th><th>' + esc(metric) + '</th><th>Cells present</th><th>Cells scored</th><th>Examples</th></tr></thead><tbody>';
  let rank = 0, previous = null;
  rows.forEach((row, i) => {
    if (row.value != null && row.value !== previous) rank = i + 1;
    h += '<tr><td>' + (row.value == null ? 'Not ranked' : rank) + '</td><td class="model-cell">' + esc(row.label) + '</td><td>' + formatMetric(metric, row.value) + '</td><td>' + row.matched + '/' + expected + '</td><td>' + row.scored + '/' + expected + '</td><td>' + row.samples.toLocaleString() + '</td></tr>';
    previous = row.value;
  });
  return h + '</tbody></table></div>';
}

let rankingMetric = 'chrf++';
function renderRankings() {
  const el = document.getElementById('tab-rankings');
  const canonical = DATA.filter(row => row._experiment_id === 'EXP-005');
  const scope = new Set((canonical.length ? canonical : DATA.filter(row => row._kind !== 'experiment')).map(exactCellKey));
  let h = '<div class="section-title">Overall model rankings</div><div class="metric-note">Equal-weight mean of dataset × direction cell scores on the frozen suite. Not a pooled corpus score or a blend of different metrics. All models/checkpoints are listed; incomplete metric or cell coverage is not ranked. Model-specific prompts differ; rankings are descriptive, not significance claims.</div>';
  h += '<label>Rank by <select id="ranking-metric">';
  ['chrf++', 'bleu', 'chrf', 'ter', 'ssa_comet_mtl'].forEach(metric => {
    h += '<option value="' + metric + '"' + (metric === rankingMetric ? ' selected' : '') + '>' + metric + (metric === 'ter' ? ' (lower is better)' : ' (higher is better)') + '</option>';
  });
  h += '</select></label>' + rankingTable(rankingRows(DATA, rankingMetric, scope), rankingMetric, scope.size);
  el.innerHTML = h;
  document.getElementById('ranking-metric').addEventListener('change', event => {
    rankingMetric = event.target.value; renderRankings();
  });
}

function renderLengths() {
  const el = document.getElementById('tab-lengths');
  let h = '<div class="section-title">Overall scores by source word count</div><div class="metric-note">Count non-empty whitespace-separated words in the original source text only, excluding prompts. Punctuation stays attached; hyphenated words count as one. This is a simple length measure, not a linguistically equivalent unit across languages. Scores must be recomputed inside each word-count range from saved predictions.</div>';
  if (!LENGTHS.bins?.length) {
    el.innerHTML = h + '<p>Length-conditioned scores are not available yet. Existing public summaries contain whole-cell scores, not per-input scores or lengths. No translation rerun is required: the private saved predictions need a CPU-only aggregation pass.</p><p>Word-count ranges: 1–25, 26–50, 51–100, 101–200, 201–400, 401–800 and 801+ words. Empty sources are reported separately.</p>';
    return;
  }
  h += '<p>Measure: source whitespace-separated words (v1). Equal-weight mean of cell scores within each range; incomplete coverage is not ranked.</p>';
  LENGTHS.bins.forEach(bin => {
    h += '<div class="section-title">' + esc(bin.label) + ' words</div>';
    h += rankingTable(rankingRows(bin.rows, 'chrf++', new Set(bin.scope_keys)), 'chrf++', bin.scope_keys.length);
  });
  el.innerHTML = h;
}

function datasetKey(d) {
  return d.dataset || (d._category || '').split('/').at(-1) || 'unknown';
}

function exactCellKey(d) {
  return datasetKey(d) + '|' + directionLabel(d) + '|' + (d.num_samples ?? '?');
}

function modelCellIndex(rows) {
  const models = {};
  rows.forEach(row => {
    if (!models[row.model]) models[row.model] = {label: displayModel(row), cells: {}};
    // A model can occur in more than one baseline experiment. Its latest dashboard
    // record replaces an identical dataset/direction/sample-count record.
    models[row.model].cells[exactCellKey(row)] = row;
  });
  return models;
}

function experimentScopeTable(experimentRows, existingModels, scopeDataset=null) {
  const scopeRows = scopeDataset
    ? experimentRows.filter(row => datasetKey(row) === scopeDataset)
    : experimentRows;
  const scopeKeys = new Set(scopeRows.map(exactCellKey));
  const candidates = [{
    label: displayModel(scopeRows[0]),
    kind: 'experiment',
    cells: Object.fromEntries(scopeRows.map(row => [exactCellKey(row), row])),
  }];
  Object.values(existingModels).forEach(model => candidates.push({
    label: model.label,
    kind: 'existing_model',
    cells: model.cells,
  }));

  const rows = candidates.map(candidate => {
    const matched = [...scopeKeys].map(key => candidate.cells[key]).filter(Boolean);
    const complete = matched.length === scopeKeys.size;
    const aggregate = {};
    ['chrf++', 'bleu', 'chrf', 'ter'].forEach(metric => {
      const values = matched.map(row => row.metrics?.[metric]).filter(value => typeof value === 'number');
      aggregate[metric] = complete && values.length === scopeKeys.size ? mean(values) : null;
    });
    return {...candidate, matched: matched.length, expected: scopeKeys.size, complete, aggregate};
  }).filter(row => row.kind === 'experiment' || row.matched > 0);

  rows.sort((a, b) => {
    if (a.kind !== b.kind) return a.kind === 'experiment' ? -1 : 1;
    if (a.complete !== b.complete) return a.complete ? -1 : 1;
    return (b.aggregate['chrf++'] ?? -Infinity) - (a.aggregate['chrf++'] ?? -Infinity);
  });
  const completeRows = rows.filter(row => row.complete);
  const best = {};
  ['chrf++', 'bleu', 'chrf', 'ter'].forEach(metric => {
    const values = completeRows.filter(row => typeof row.aggregate[metric] === 'number');
    if (!values.length) return;
    const lower = metric === 'ter';
    best[metric] = values.reduce((winner, row) =>
      lower
        ? (row.aggregate[metric] < winner.aggregate[metric] ? row : winner)
        : (row.aggregate[metric] > winner.aggregate[metric] ? row : winner)
    ).label;
  });

  let h = '<div class="table-wrap"><table><thead><tr><th>Model</th><th>Exact coverage</th><th>chrF++</th><th>BLEU</th><th>chrF</th><th>TER</th></tr></thead><tbody>';
  rows.forEach(row => {
    const rowClass = row.kind === 'experiment' ? ' class="experiment-row"' : '';
    const coverageClass = row.complete ? '' : ' class="coverage-incomplete"';
    h += '<tr' + rowClass + '><td class="model-cell">' + esc(row.label) + (row.kind === 'experiment' ? ' <span class="metric-status status-scored">Our experiment</span>' : '') + '</td>';
    h += '<td' + coverageClass + '>' + row.matched + '/' + row.expected + (row.complete ? '' : ' · not ranked') + '</td>';
    ['chrf++', 'bleu', 'chrf', 'ter'].forEach(metric => {
      const cls = row.complete && best[metric] === row.label ? ' class="best"' : '';
      h += '<td' + cls + '>' + formatMetric(metric, row.aggregate[metric]) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

function renderExperiments() {
  const el = document.getElementById('tab-experiments');
  const experimental = DATA.filter(row => row._kind === 'experiment');
  if (!experimental.length) {
    el.innerHTML = '<div class="metric-note">No completed experiment evaluation is available yet.</div>';
    return;
  }
  const existingModels = modelCellIndex(DATA.filter(row => row._kind !== 'experiment'));
  const byExperiment = {};
  experimental.forEach(row => {
    const id = row._experiment_id || row.model;
    if (!byExperiment[id]) byExperiment[id] = [];
    byExperiment[id].push(row);
  });

  let h = '<div class="metric-note">Only exact matches are compared: the same complete dataset, translation direction, and number of examples. Scores are simple means across those dataset-direction cells. Models with incomplete coverage are shown but are not ranked. Higher is better except for TER. This view is descriptive; use paired uncertainty tests before making improvement claims.</div>';
  Object.entries(byExperiment).forEach(([experimentId, experimentRows]) => {
    experimentRows.sort((a, b) => exactCellKey(a).localeCompare(exactCellKey(b)));
    const totalOutputs = experimentRows.reduce((total, row) => total + (row.num_samples || 0), 0);
    const datasets = [...new Set(experimentRows.map(datasetKey))].sort();
    const artifact = experimentRows[0]._artifact_sha256;
    h += '<div class="category-title">' + esc(experimentId) + '</div>';
    h += '<div class="section-title">' + esc(displayModel(experimentRows[0])) + '</div>';
    h += '<div class="coverage-grid">';
    h += '<div class="coverage-card"><div class="value">' + experimentRows.length + '</div><div class="label">Complete dataset-direction cells</div></div>';
    h += '<div class="coverage-card"><div class="value">' + totalOutputs.toLocaleString() + '</div><div class="label">Translations evaluated</div></div>';
    h += '<div class="coverage-card"><div class="value">' + datasets.length + '</div><div class="label">Complete datasets</div></div>';
    h += '</div>';
    if (artifact) h += '<div class="metric-note">Checkpoint fingerprint: ' + esc(artifact.slice(0, 12)) + '…</div>';
    h += '<div class="section-title">All selected datasets</div>';
    h += experimentScopeTable(experimentRows, existingModels);
    datasets.forEach(dataset => {
      h += '<div class="section-title">' + esc(dataset) + '</div>';
      h += experimentScopeTable(experimentRows, existingModels, dataset);
    });

    h += '<details><summary>Dataset and translation-direction breakdown</summary>';
    h += '<div class="table-wrap"><table><thead><tr><th>Dataset</th><th>Direction</th><th>Samples</th><th>Our chrF++</th><th>Best existing model</th><th>Existing chrF++</th><th>Difference</th></tr></thead><tbody>';
    experimentRows.forEach(row => {
      const key = exactCellKey(row);
      const baselineMatches = Object.values(existingModels)
        .map(model => ({label: model.label, row: model.cells[key]}))
        .filter(match => typeof match.row?.metrics?.['chrf++'] === 'number')
        .sort((a, b) => b.row.metrics['chrf++'] - a.row.metrics['chrf++']);
      const bestExisting = baselineMatches[0];
      const experimentScore = row.metrics?.['chrf++'];
      const delta = bestExisting && typeof experimentScore === 'number'
        ? experimentScore - bestExisting.row.metrics['chrf++']
        : null;
      h += '<tr class="experiment-row"><td>' + esc(datasetKey(row)) + '</td><td>' + esc(directionLabel(row)) + '</td><td>' + (row.num_samples ?? '—') + '</td>';
      h += '<td>' + formatMetric('chrf++', experimentScore) + '</td>';
      h += '<td class="model-cell">' + (bestExisting ? esc(bestExisting.label) : '—') + '</td>';
      h += '<td>' + formatMetric('chrf++', bestExisting?.row?.metrics?.['chrf++']) + '</td>';
      h += '<td>' + (delta == null ? '—' : signed(delta)) + '</td></tr>';
    });
    h += '</tbody></table></div></details>';
  });
  el.innerHTML = h;
}

function renderPaired() {
  const el = document.getElementById('tab-paired');
  const comparisons = Object.values(PAIRED.comparisons || {});
  if (!comparisons.length) {
    el.innerHTML = '<div class="metric-note">No paired cross-experiment analysis is available.</div>';
    return;
  }
  let h = '<div class="metric-note">Differences are candidate minus baseline. Cell tests use paired chrF++ bootstrap resampling; significant counts use Holm correction within each 58-cell comparison family. Macro intervals resample the frozen evaluation cells.</div>';
  h += '<div class="table-wrap"><table><thead><tr><th>Baseline</th><th>Candidate</th><th>Macro Δ chrF++</th><th>95% interval</th><th>Candidate wins</th><th>Baseline wins</th><th>Holm-significant</th></tr></thead><tbody>';
  comparisons.forEach(comparison => {
    const summary = comparison.summary.all;
    h += '<tr><td class="model-cell">' + esc(pairedModel(comparison.baseline)) + '</td>';
    h += '<td class="model-cell">' + esc(pairedModel(comparison.candidate)) + '</td>';
    h += '<td>' + signed(summary.candidate_minus_baseline_cell_macro) + '</td>';
    h += '<td>[' + signed(summary.cell_macro_ci95[0]) + ', ' + signed(summary.cell_macro_ci95[1]) + ']</td>';
    h += '<td>' + summary.candidate_wins + '/' + summary.num_cells + '</td>';
    h += '<td>' + summary.baseline_wins + '/' + summary.num_cells + '</td>';
    h += '<td>' + summary.holm_significant_cells + '/' + summary.num_cells + '</td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="section-title">Dataset and direction breakdown</div>';
  comparisons.forEach(comparison => {
    h += '<details><summary>' + esc(pairedModel(comparison.baseline)) + ' vs ' + esc(pairedModel(comparison.candidate)) + '</summary>';
    h += '<div class="table-wrap"><table><thead><tr><th>Scope</th><th>Macro Δ chrF++</th><th>95% interval</th><th>Candidate wins</th><th>Baseline wins</th><th>Holm-significant</th></tr></thead><tbody>';
    Object.entries(comparison.summary).filter(([scope]) => scope !== 'all').forEach(([scope, summary]) => {
      h += '<tr><td>' + esc(scope.replace('dataset:', '').replace('direction:', '')) + '</td>';
      h += '<td>' + signed(summary.candidate_minus_baseline_cell_macro) + '</td>';
      h += '<td>[' + signed(summary.cell_macro_ci95[0]) + ', ' + signed(summary.cell_macro_ci95[1]) + ']</td>';
      h += '<td>' + summary.candidate_wins + '/' + summary.num_cells + '</td>';
      h += '<td>' + summary.baseline_wins + '/' + summary.num_cells + '</td>';
      h += '<td>' + summary.holm_significant_cells + '/' + summary.num_cells + '</td></tr>';
    });
    h += '</tbody></table></div></details>';
  });
  el.innerHTML = h;
}

renderOverview();
renderComparison();
renderRankings();
renderLengths();
renderExperiments();
renderPaired();
</script>
